server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /IV/v1/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
